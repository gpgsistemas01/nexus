name: CI

on:
  push:
    branches:
      - main
      - master
      - features
  pull_request:

jobs:
  architecture-docs:
    name: Keep architecture docs current
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # El generador sólo usa módulos nativos de Node.js, por lo que esta
      # comprobación no necesita instalar las dependencias de la aplicación.
      - name: Verify generated architecture documentation outside main
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run docs:check

      - name: Regenerate architecture documentation on the main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run docs:architecture

      - name: Commit updated diagrams on the main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/architecture/views/development/code-map.md docs/architecture/views/logical/data-and-persistence/generated/; then
            echo "Generated diagrams are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/views/development/code-map.md docs/architecture/views/logical/data-and-persistence/generated/
          git commit -m "docs: actualizar diagramas generados"
          git push

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26.12.1']
    defaults:
      run:
        working-directory: back

    env:
      # Variables no sensibles para armar las URLs efímeras de la BD de CI
      # en tiempo de ejecución, sin dejar cadenas de conexión completas en YAML.
      CI_POSTGRES_USER: postgres
      CI_POSTGRES_PASSWORD: postgres
      CI_POSTGRES_HOST: localhost
      CI_POSTGRES_PORT: 5432
      CI_DATABASE_NAME: smyb_ci_do_not_use
      CI_DATABASE_TEST_NAME: smyb_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: back/package-lock.json

      # ubuntu-latest ya incluye PostgreSQL. Usarlo evita que una caída de
      # Docker Hub impida iniciar el job antes de ejecutar nuestras pruebas.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<SQL
          ALTER USER "${CI_POSTGRES_USER}" WITH PASSWORD '${CI_POSTGRES_PASSWORD}';
          CREATE DATABASE "${CI_DATABASE_TEST_NAME}";
          SQL
          pg_isready --host "${CI_POSTGRES_HOST}" --port "${CI_POSTGRES_PORT}" --username "${CI_POSTGRES_USER}" --dbname "${CI_DATABASE_TEST_NAME}"

      - name: Configure database URLs
        run: |
          DATABASE_URL="postgresql://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_DATABASE_NAME}?schema=public"
          DATABASE_TEST_URL="postgresql://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_DATABASE_TEST_NAME}?schema=public"
          echo "::add-mask::${DATABASE_URL}"
          echo "::add-mask::${DATABASE_TEST_URL}"
          echo "DATABASE_URL=${DATABASE_URL}" >> "${GITHUB_ENV}"
          echo "DATABASE_TEST_URL=${DATABASE_TEST_URL}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Verify test database configuration
        run: |
          npm run test:db:verify
          DATABASE_URL="$DATABASE_TEST_URL" node --input-type=module -e "import { getDatabaseUrl } from './src/lib/databaseUrl.js'; if (getDatabaseUrl() !== process.env.DATABASE_TEST_URL) { throw new Error('CI must use DATABASE_TEST_URL for tests.'); }"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:unit -- --coverage --reporter=default --reporter=junit --outputFile=build/test-results/unit.xml

      # Integración valida DATABASE_TEST_URL y aplica migraciones antes de Vitest.
      - name: Run database migrations and integration tests
        run: npm run test:integration -- --coverage --reporter=default --reporter=junit --outputFile=build/test-results/integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node }}
          path: back/build/test-results/*.xml
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-${{ matrix.node }}
          path: |
            back/coverage/unit/
            back/coverage/integration/
          if-no-files-found: warn

  frontend-build:
    name: Build Vue frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.15.0', '26.12.1']
    defaults:
      run:
        working-directory: front
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --engine-strict

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Verify Vue documentation and generated reference
        run: npm run docs:check

      - name: Test frontend components and navigation
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile=build/test-results/unit.xml

      - name: Type-check and build frontend
        run: npm run build

      - name: Install browser for frontend tests
        run: npx playwright install --with-deps chromium

      - name: Test login and warehouse in browser
        run: npm run test:e2e

      - name: Install backend for the system browser test
        if: matrix.node == '24.15.0'
        run: npm --prefix ../back ci --include=dev

      - name: Prepare isolated PostgreSQL for the system browser test
        if: matrix.node == '24.15.0'
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<SQL
          ALTER USER postgres WITH PASSWORD 'postgres';
          CREATE DATABASE nexus_vue_test;
          SQL
          DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/nexus_unused"
          DATABASE_TEST_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/nexus_vue_test"
          echo "::add-mask::${DATABASE_URL}"
          echo "::add-mask::${DATABASE_TEST_URL}"
          echo "DATABASE_URL=${DATABASE_URL}" >> "$GITHUB_ENV"
          echo "DATABASE_TEST_URL=${DATABASE_TEST_URL}" >> "$GITHUB_ENV"
          echo "DIRECT_TEST_URL=${DATABASE_TEST_URL}" >> "$GITHUB_ENV"

      - name: Apply migrations to the system test database
        if: matrix.node == '24.15.0'
        run: npm --prefix ../back run test:db:migrate

      - name: Test Vue with real Express and PostgreSQL
        if: matrix.node == '24.15.0'
        run: npm run test:e2e:system

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-node-${{ matrix.node }}
          path: front/build/test-results/*.xml
          if-no-files-found: warn
