name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  architecture-docs:
    name: Keep architecture docs current
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # El generador sólo usa módulos nativos de Node.js, por lo que esta
      # comprobación no necesita instalar las dependencias de la aplicación.
      - name: Verify generated architecture documentation outside main
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run docs:check

      - name: Regenerate architecture documentation on the main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run docs:architecture

      - name: Commit updated diagrams on the main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/generated; then
            echo "Generated diagrams are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated
          git commit -m "docs: actualizar diagramas generados"
          git push

  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      # Variables no sensibles para armar las URLs efímeras de la BD de CI
      # en tiempo de ejecución, sin dejar cadenas de conexión completas en YAML.
      CI_POSTGRES_USER: postgres
      CI_POSTGRES_PASSWORD: postgres
      CI_POSTGRES_HOST: localhost
      CI_POSTGRES_PORT: 5432
      CI_DATABASE_NAME: smyb_ci_do_not_use
      CI_DATABASE_TEST_NAME: smyb_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ubuntu-latest ya incluye PostgreSQL. Usarlo evita que una caída de
      # Docker Hub impida iniciar el job antes de ejecutar nuestras pruebas.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<SQL
          ALTER USER "${CI_POSTGRES_USER}" WITH PASSWORD '${CI_POSTGRES_PASSWORD}';
          CREATE DATABASE "${CI_DATABASE_TEST_NAME}";
          SQL
          pg_isready --host "${CI_POSTGRES_HOST}" --port "${CI_POSTGRES_PORT}" --username "${CI_POSTGRES_USER}" --dbname "${CI_DATABASE_TEST_NAME}"

      - name: Configure database URLs
        run: |
          DATABASE_URL="postgresql://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_DATABASE_NAME}?schema=public"
          DATABASE_TEST_URL="postgresql://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_DATABASE_TEST_NAME}?schema=public"
          echo "::add-mask::${DATABASE_URL}"
          echo "::add-mask::${DATABASE_TEST_URL}"
          echo "DATABASE_URL=${DATABASE_URL}" >> "${GITHUB_ENV}"
          echo "DATABASE_TEST_URL=${DATABASE_TEST_URL}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Verify test database configuration
        run: |
          npm run test:db:verify
          DATABASE_URL="$DATABASE_TEST_URL" node --input-type=module -e "import { getDatabaseUrl } from './src/lib/databaseUrl.js'; if (getDatabaseUrl() !== process.env.DATABASE_TEST_URL) { throw new Error('CI must use DATABASE_TEST_URL for tests.'); }"

      - name: Generate Prisma client
        run: npx prisma generate

      # Para CI usamos test:db (no solo npm test) porque este script valida
      # DATABASE_TEST_URL, aplica migraciones y luego ejecuta Vitest.
      - name: Run database migrations and tests
        run: npm run test:db
