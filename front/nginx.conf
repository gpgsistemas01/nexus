map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS de Docker; el backend se resuelve al recibir la solicitud.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream "${BACKEND_UPSTREAM}";

    # API y módulos EJS bajo el mismo origen para conservar las cookies HttpOnly.
    location ~ ^/(api|almacen|compras|salidas|usuarios-sistemas|personas|clientes|proveedores|movimientos|catalogos|revocar-sesion|cerrar-sesion|error|css|js|img|shared|socket\.io)(/|$) {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # Los archivos ausentes no deben responder con el HTML de la aplicación.
    location /assets/ {
        try_files $uri =404;
    }

    # Permite abrir y recargar rutas del frontend gestionadas por Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
